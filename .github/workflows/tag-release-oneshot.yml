# One-shot helper: creates the v0.3.1 release tag when this trigger branch
# is pushed. The tag targets the PR #9 merge commit. This branch and the
# workflow file are removed again right after the tag exists; the tag points
# at an earlier commit, so none of this is part of the tagged tree.
name: tag-release-oneshot

on:
  push:
    branches:
      - claude/trigger-tag-v0-3-1

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v0.3.1',
              sha: 'd313f25aa760161643d5c418edb687d1a4dfc1b8',
            });
            core.info('created refs/tags/v0.3.1');
