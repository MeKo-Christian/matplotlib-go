# One-shot helper: creates the v0.3.1 release tag via workflow_dispatch.
# The tag targets the PR #9 merge commit. This file is removed again right
# after the tag exists; it is not part of the tagged tree (the tag points
# at an earlier commit).
name: tag-release-oneshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v0.3.1',
              sha: 'd313f25aa760161643d5c418edb687d1a4dfc1b8',
            });
            core.info('created refs/tags/v0.3.1');
