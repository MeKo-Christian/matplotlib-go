name: unit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the golden/reference parity set is calibrated against the
        # vendored FreeType 2.6.1 on Linux, so the raster goldens are not
        # portable to macOS rasterization.
        os: [ubuntu-latest]
        # go.mod requires Go 1.25 (via golang.org/x/* dependencies), so the
        # toolchain is pinned there; the runner downloads it automatically.
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install build dependencies
        uses: ./.github/actions/setup-cgo-deps
      - name: Build
        run: CGO_ENABLED=1 go build -tags freetype ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet -tags freetype ./...
      - name: Test
        run: CGO_ENABLED=1 go test -tags freetype ./...
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-go${{ matrix.go }}
          path: |
            testdata/_artifacts/
            *.png
          if-no-files-found: ignore
          retention-days: 7
