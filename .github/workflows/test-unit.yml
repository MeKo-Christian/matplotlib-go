name: test-unit

on:
  workflow_call:

permissions:
  contents: read

# Linux only: the golden/reference parity set is calibrated against the vendored
# FreeType 2.6.1 on Linux, so the raster goldens are not portable to macOS
# rasterization. The Go toolchain comes from go.mod rather than a matrix pin.
jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        uses: ./.github/actions/setup-cgo-deps

      - name: Provision matplotlib parity source
        run: bash third_party/fetch-matplotlib.sh

      - name: Test
        run: CGO_ENABLED=1 go test -tags freetype ./...

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            testdata/_artifacts/
            *.png
          if-no-files-found: ignore
          retention-days: 7
