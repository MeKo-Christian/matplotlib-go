name: test-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        uses: ./.github/actions/setup-cgo-deps

      - name: Verify module integrity
        run: go mod verify

      - name: Build
        run: CGO_ENABLED=1 go build -tags freetype ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet -tags freetype ./...

      - name: Build CLI
        run: CGO_ENABLED=1 go build -tags freetype -o matplotlib-go ./main.go

      - name: Test CLI
        run: ./matplotlib-go --help
