name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install build dependencies
        uses: ./.github/actions/setup-cgo-deps
      - name: golangci-lint
        # .golangci.toml is a v2 config, so use golangci-lint v2 (action v7+).
        # Its prebuilt binary is built with a Go >= the go 1.25 module target.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          # Match the local `just lint` convention (--new-from-merge-base): only
          # fail on issues a change introduces, not the pre-existing backlog.
          only-new-issues: true
