name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install build dependencies
        uses: ./.github/actions/setup-cgo-deps

      - name: Verify module integrity
        run: go mod verify

      - name: Run tests
        run: CGO_ENABLED=1 go test -tags freetype ./...

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-linux
          path: testdata/_artifacts/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install build dependencies
        uses: ./.github/actions/setup-cgo-deps

      - name: Build
        run: CGO_ENABLED=1 go build -tags freetype ./...

      - name: Build CLI
        run: CGO_ENABLED=1 go build -tags freetype -o matplotlib-go ./main.go

      - name: Test CLI
        run: ./matplotlib-go --help
