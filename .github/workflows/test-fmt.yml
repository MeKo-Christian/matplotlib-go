name: test-fmt

on:
  workflow_call:

permissions:
  contents: read

# gofumpt's output depends on the Go toolchain it is built with, so the Go
# version and every formatter version are pinned here to keep CI deterministic
# and aligned with the versions the tree is formatted against. Bumping any of
# these requires reformatting the tree in the same change. This is deliberately
# not go.mod's version, unlike the other checks.
jobs:
  test-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install formatters
        run: |
          npm install -g prettier@3.8.0
          go install mvdan.cc/gofumpt@v0.10.0
          go install github.com/daixiang0/gci@v0.14.0
      - name: Install treefmt
        if: hashFiles('treefmt.toml') != ''
        run: |
          set -euo pipefail
          version="2.5.0"
          tmpdir="$(mktemp -d)"
          curl -fsSL "https://github.com/numtide/treefmt/releases/download/v${version}/treefmt_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$tmpdir"
          sudo install -m 0755 "$tmpdir/treefmt" /usr/local/bin/treefmt
          treefmt --version
      - name: Check format
        run: |
          if [ -f treefmt.toml ]; then
            treefmt --fail-on-change --allow-missing-formatter
          else
            echo "treefmt.toml not found; skipping treefmt check"
          fi
